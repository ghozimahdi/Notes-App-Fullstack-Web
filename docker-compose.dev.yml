services:
  frontend_dev:
    build:
      context: ./frontend
      args:
        NODE_ENV: development
    container_name: frontend_dev
    ports:
      - "3001:80"
    environment:
      VITE_BACKEND_URL: http://backend_dev:5000
      VITE_ENV: development
    depends_on:
      - backend_dev

  backend_dev:
    build:
      context: ./backend
      args:
        NODE_ENV: development
        MONGODB_URI: mongodb://mongo:27017/note_db_dev
        REDIS_HOST: redis
        SESSION_SECRET: dev_secret
    container_name: backend_dev
    ports:
      - "5001:5000"
    depends_on:
      - mongo
      - redis